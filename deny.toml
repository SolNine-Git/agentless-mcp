[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]
# Above cargo-deny's 0.8 default, so that an edited license text does not pass as an allowed license.
confidence-threshold = 0.9

[licenses.private]
ignore = true

# rusqlite's statement cache reaches foldhash through hashlink and hashbrown.
[[licenses.exceptions]]
crate = "foldhash"
allow = ["Zlib"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# A path dependency between the workspace's private crates names no version; a registry one still must.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
