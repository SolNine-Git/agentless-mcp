name: Release

# Every push runs the release checks and builds every artifact. Only a v* tag uploads to PyPI,
# and only after every job below passes. The publish job runs in the GitHub environment pypi,
# which accepts a deployment from a v* tag only and waits for a required reviewer.
on:
  push:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.sha || 'latest' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  # P1 R-13: the rust job lints and tests the dev profile on two targets. This job covers each wheel
  # target with the release profile, so a cfg that only a wheel turns on is checked before the build.
  checks:
    name: ${{ matrix.target }} / release-profile clippy and tests
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: &targets
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            image: quay.io/pypa/manylinux_2_34_x86_64@sha256:76d305ac7c79ec42f67fe2039f1cbfaa62fbaaa28138fc5b97edb5c357b9752c # 2026.10.02-1
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_34_aarch64@sha256:b6cc7cd41c97bd7db5ba8ea82b6d16d034487643abd6b46d81cf631bf118b326 # 2026.10.02-1
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # The hooks catch panics, so a release build that aborts on panic would break them.
      - name: The release profile unwinds on panic
        run: |
          python3 - <<'PY'
          import sys
          import tomllib

          with open("Cargo.toml", "rb") as manifest:
              release = tomllib.load(manifest).get("profile", {}).get("release", {})
          if release.get("panic", "unwind") != "unwind":
              sys.exit(f"profile.release.panic is {release['panic']!r}: the hooks need unwind")
          PY

      - name: Stable toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: "false"
          prefix-key: v1-release

      - name: Locked dependencies
        run: cargo metadata --locked --format-version 1 > /dev/null

      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-nextest@0.9.148
          fallback: none

      # install-action holds no cargo-insta 1.49.0 binary for aarch64 Linux. A build with the crate's own
      # lock gives every target the same pinned cargo-insta.
      - name: cargo-insta
        run: cargo install --locked cargo-insta@1.49.0

      - name: Install uv
        if: runner.os != 'Linux'
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: 0.9.28
          python-version: "3.13"

      # The committed graph fixtures come from Linux. Another platform rewrites them with the reference.
      - name: Graph fixtures from the reference on this platform
        if: runner.os != 'Linux'
        run: scripts/platform_graph_fixtures.sh "$RUNNER_TEMP/reference"

      - name: Clippy with the release profile
        run: cargo clippy --workspace --all-targets --release -- -D warnings

      - name: Tests with the release profile
        run: cargo insta test --check --workspace --test-runner nextest --release

  notices:
    name: notices
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Stable toolchain
        run: rustup toolchain install

      # cargo-about runs with --frozen, so every crate must be in the cache first.
      - name: Fetch the locked crates
        run: cargo fetch --locked

      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-about@0.9.2
          fallback: none

      - name: Write the notices
        run: packaging/notices.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notices
          path: packaging/notices
          if-no-files-found: error

  wheels:
    name: ${{ matrix.target }} / wheel
    needs: notices
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: *targets
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: notices
          path: packaging/notices

      - name: Linux wheel in the manylinux image
        if: runner.os == 'Linux'
        env:
          IMAGE: ${{ matrix.image }}
        run: docker run --rm --volume "$GITHUB_WORKSPACE:/io" --workdir /io "$IMAGE" packaging/manylinux.sh /io/dist

      - name: Install uv
        if: runner.os == 'macOS'
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: 0.9.28
          python-version: "3.13"

      - name: macOS wheel
        if: runner.os == 'macOS'
        run: |
          rustup toolchain install
          uv venv "$RUNNER_TEMP/build"
          uv pip install --python "$RUNNER_TEMP/build" --no-deps --require-hashes \
            --requirement packaging/build-requirements.txt
          cd packaging
          "$RUNNER_TEMP/build/bin/maturin" build --release --locked --out ../dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  # Each wheel on a fresh runner of its target, in an environment that holds nothing else.
  installed:
    name: ${{ matrix.target }} / installed wheel
    needs: wheels
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: *targets
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel-${{ matrix.target }}
          path: dist

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: 0.9.28
          python-version: "3.13"

      - name: Install the wheel in a clean environment
        run: |
          uv venv "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv" --no-index --no-deps dist/*.whl

      - name: Both commands answer and one map call works
        run: '"$RUNNER_TEMP/venv/bin/python" packaging/check_wheel.py smoke --bin-dir "$RUNNER_TEMP/venv/bin"'

  # The sdist, then a working wheel from a clean copy of it: a Rust toolchain, the vendored grammar
  # archive, and no network after the crate fetch.
  sdist:
    name: sdist
    needs: notices
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: notices
          path: packaging/notices

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: 0.9.28
          python-version: "3.13"

      - name: Build backend
        run: |
          uv venv --seed "$RUNNER_TEMP/build"
          uv pip install --python "$RUNNER_TEMP/build" --no-deps --require-hashes \
            --requirement packaging/build-requirements.txt
          echo "$RUNNER_TEMP/build/bin" >> "$GITHUB_PATH"

      - name: Build the sdist
        working-directory: packaging
        run: maturin sdist --out ../dist

      - name: A wheel from a clean copy of the sdist
        run: |
          clean="$RUNNER_TEMP/clean"
          mkdir "$clean"
          tar -xzf dist/*.tar.gz -C "$clean"
          cd "$clean"/*/
          RUSTUP_TOOLCHAIN="$(sed -n 's/^channel = "\(.*\)"$/\1/p' "$GITHUB_WORKSPACE/rust-toolchain.toml")"
          export RUSTUP_TOOLCHAIN
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          # The sdist carries the workspace lock, and cargo prunes it to the sdist's crates. A pruned
          # lock may drop versions but must add none.
          cargo fetch
          python - "$GITHUB_WORKSPACE/Cargo.lock" Cargo.lock <<'PY'
          import sys
          import tomllib


          def versions(path):
              with open(path, "rb") as lock:
                  return {(row["name"], row["version"]) for row in tomllib.load(lock)["package"]}


          added = versions(sys.argv[2]) - versions(sys.argv[1])
          if added:
              sys.exit(f"the sdist build resolves versions that Cargo.lock lacks: {sorted(added)}")
          PY
          CARGO_NET_OFFLINE=true PIP_NO_INDEX=1 python -m pip wheel --no-build-isolation --no-deps \
            --wheel-dir "$RUNNER_TEMP/from-sdist" .
          uv venv "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv" --no-index --no-deps "$RUNNER_TEMP"/from-sdist/*.whl
          "$RUNNER_TEMP/venv/bin/python" "$GITHUB_WORKSPACE/packaging/check_wheel.py" smoke \
            --bin-dir "$RUNNER_TEMP/venv/bin"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # Binds an ephemeral 127.0.0.1 port, so it runs here and not in a unit test.
  end-to-end:
    name: end-to-end / installed wheel serves stdio and HTTP
    needs: wheels
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel-x86_64-unknown-linux-gnu
          path: dist

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: 0.9.28
          python-version: "3.13"

      - name: Install the wheel in a clean environment
        run: |
          uv venv "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv" --no-index --no-deps dist/*.whl

      - name: One stdio session and one HTTP session
        run: '"$RUNNER_TEMP/venv/bin/python" packaging/check_wheel.py e2e --bin-dir "$RUNNER_TEMP/venv/bin"'

  # Trusted publishing: PyPI accepts the OIDC token of this workflow file in the environment pypi.
  publish:
    name: upload to PyPI
    needs: [checks, installed, sdist, end-to-end]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "{wheel-*,sdist}"
          path: dist
          merge-multiple: true

      - name: Every file carries the tag's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          ls -l dist
          test "$(find dist -name "agentless_mcp-$version-*.whl" | wc -l)" -eq 4
          test "$(find dist -name "agentless_mcp-$version.tar.gz" | wc -l)" -eq 1
          test "$(find dist -type f | wc -l)" -eq 5

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: 0.9.28

      - name: Upload
        run: uv publish --trusted-publishing always dist/*
