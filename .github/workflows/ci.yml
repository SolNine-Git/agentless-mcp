name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  # A run on main or a v* tag judges only its own push range, so no such run may be cancelled. Each commit
  # there gets its own group, because a new run in a group cancels the run that waits in it.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.sha || 'latest' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  rust:
    name: ${{ matrix.os }} / Rust
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # xtask erosion and policy read the history from the base to HEAD.
          fetch-depth: 0
          persist-credentials: false

      - name: Stable toolchain
        run: rustup toolchain install

      # No ~/.cargo/bin in the cache, so each tool binary comes from this run's install steps. The new
      # prefix keeps every entry that holds ~/.cargo/bin from a restore.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: "false"
          prefix-key: v1-rust

      # Before the first build: without --locked, cargo rewrites a stale Cargo.lock and builds a graph
      # that the commit does not hold. Every later cargo call resolves to this same lock.
      - name: Locked dependencies
        run: cargo metadata --locked --format-version 1 > /dev/null

      # xtask names the nightly that cargo public-api builds with, so the two cannot differ.
      - name: Nightly toolchain
        run: |
          nightly="$(cargo xtask nightly)"
          rustup toolchain install "$nightly" --profile minimal

      # The fallback would install an unpinned cargo-binstall, which can run third-party binaries.
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-nextest@0.9.148,cargo-deny@0.19.0,cargo-machete@0.9.2,cargo-insta@1.49.0
          fallback: none

      # install-action has no cargo-public-api, and the crate publishes no binaries. --force builds it from
      # source even when the runner already holds that version.
      - name: cargo-public-api
        run: |
          cargo install --locked --force cargo-public-api@0.52.0
          cargo public-api --version

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: 0.9.28
          python-version: "3.13"

      # The file hooks, ruff and codespell, on one platform. The cargo hooks are steps of their own below.
      - name: Pre-commit
        if: runner.os == 'Linux'
        env:
          SKIP: cargo-fmt,cargo-clippy,cargo-gates,cargo-deps
        run: uv run --frozen --only-group dev pre-commit run --all-files

      # The gate is never the build under test: it is the wheel that .github/gate/requirements.txt
      # pins. Outside the workspace: lint --since reads every file there that git does not ignore.
      - name: Gate binary
        run: |
          gate="$RUNNER_TEMP/agentless-mcp-gate"
          uv venv "$gate"
          uv pip install --python "$gate/bin/python" --require-hashes --only-binary :all: \
            --requirement .github/gate/requirements.txt
          echo "GATE_BIN=$gate/bin/agentless-mcp" >> "$GITHUB_ENV"
          "$gate/bin/agentless-mcp" warmup

      # On a push to main the merge base is HEAD, so policy and erosion judge the pushed range. A new
      # branch (zero SHA) and a v* tag keep the merge base: each main commit's push run judged it.
      - name: Gate base on a push to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BEFORE: ${{ github.event.before }}
        run: echo "GATE_BASE=$BEFORE" >> "$GITHUB_ENV"

      # First, because the gates below read the policy files that this step judges.
      - name: Policy
        run: cargo xtask policy ${GATE_BASE:+--base "$GATE_BASE"}

      - name: Format and clippy
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo insta test --check --workspace --test-runner nextest

      # --no-ignore: an ignore file or a hidden directory hides no manifest from machete. The roots hold
      # every package, and unlike --skip-target-dir they keep a package in a directory named target.
      - name: Dependencies
        run: |
          cargo deny check
          cargo machete --no-ignore crates xtask

      - name: Static gates
        run: cargo xtask static-gates

      # What the token rules cannot see: force-warned suppressions, the files rustc reads, the cfg names,
      # the build-time packages, and the ignored tests.
      - name: Ground truth
        run: cargo xtask ground-truth

      - name: Public API
        run: cargo xtask public-api

      - name: Erosion gate
        run: cargo xtask erosion --lint-bin "$GATE_BIN" --health-bin "$GATE_BIN" ${GATE_BASE:+--base "$GATE_BASE"}

      - name: Every gate fails on its violation
        run: scripts/gate-selftest.sh "$GATE_BIN"
