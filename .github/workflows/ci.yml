name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TREE_SITTER_LANGUAGE_PACK_CACHE_DIR: ${{ github.workspace }}/.ci-grammars

jobs:
  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Cache tree-sitter grammars
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.TREE_SITTER_LANGUAGE_PACK_CACHE_DIR }}
          key: grammars-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: grammars-${{ runner.os }}-

      - name: Sync
        run: uv sync --extra mcp

      - name: Warm grammars
        run: uv run agentless-mcp warmup

      - name: Pre-commit
        run: uv run pre-commit run --all-files

      - name: Test
        run: uv run pytest
