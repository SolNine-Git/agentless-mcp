name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TREE_SITTER_LANGUAGE_PACK_CACHE_DIR: ${{ github.workspace }}/.ci-grammars

jobs:
  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Cache tree-sitter grammars
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.TREE_SITTER_LANGUAGE_PACK_CACHE_DIR }}
          key: grammars-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: grammars-${{ runner.os }}-

      # Both extras, deliberately. Until 2026-08-23 this synced only --extra
      # mcp, so the three tiktoken tests in tests/unit/test_token_counter.py
      # skipped on every run and the exact-token-count path was never
      # exercised in CI -- a guarantee whose gate never fired.
      - name: Sync
        run: uv sync --extra mcp --extra tokens

      - name: Warm grammars
        run: uv run agentless-mcp warmup

      - name: Pre-commit
        run: uv run pre-commit run --all-files

      # Under coverage, not bare pytest: the CLI suite spawns the console
      # script as a subprocess, and COVERAGE_PROCESS_START plus `combine` is
      # what makes those children report. See [tool.coverage.run] in
      # pyproject.toml for why the parallel form is the only supported one.
      # `-rs` reports every skip in this same run, so the skip ceiling below
      # costs nothing extra. The suite is not run twice.
      - name: Test
        env:
          COVERAGE_PROCESS_START: pyproject.toml
        run: uv run coverage run -m pytest -rs | tee pytest-output.txt

      - name: Coverage
        run: |
          uv run coverage combine
          uv run coverage report

      # The prompt JSON and the agent guide are read through
      # `importlib.resources`, which in a checkout resolves to `src/`. Every
      # test of them therefore passes whether or not the files are in the
      # distribution, so a wheel that shipped without them would fail at the
      # user's first import and nowhere earlier. `uv_build` includes them
      # today by its include-everything default and exposes no positive wheel
      # include to declare that intent in pyproject.toml, which leaves this
      # step as the only place the guarantee can be stated.
      - name: Packaged data ships in the wheel
        run: |
          rm -rf dist
          uv build --wheel
          uv run python - <<'PY'
          import pathlib
          import sys
          import zipfile

          wheels = sorted(pathlib.Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              sys.exit(f"expected exactly one wheel in dist/, found {wheels}")
          required = {
              "agentless_mcp/prompts/envelope.json",
              "agentless_mcp/prompts/messages.json",
              "agentless_mcp/prompts/parameter_descriptions.json",
              "agentless_mcp/prompts/tool_descriptions.json",
              "agentless_mcp/docs/agent-guide.md",
          }
          members = set(zipfile.ZipFile(wheels[0]).namelist())
          missing = sorted(required - members)
          if missing:
              sys.exit(f"{wheels[0].name} is missing packaged data: {missing}")
          print(f"{wheels[0].name} carries all {len(required)} packaged data files")
          PY

      # A skip is invisible in the summary line, which is how three tiktoken
      # tests sat un-run in CI for several releases. Assert the count instead
      # of eyeballing it; lower the ceiling whenever a skip is retired.
      - name: No unexpected skips
        run: |
          skips=$(grep -cE '^SKIPPED' pytest-output.txt || true)
          echo "skipped: $skips (ceiling 10)"
          test "$skips" -le 10
