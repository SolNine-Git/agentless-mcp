[package]
name = "render"
description = "The text and JSON forms of the answers: the receipt envelope, the lint and capabilities reports, the read views, and the patch, validate and vote answers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
app = { path = "../app" }
facts = { path = "../facts" }
git = { path = "../git" }
io = { path = "../io" }
json = { path = "../json" }
kernel = { path = "../kernel" }
patch = { path = "../patch" }
prompts = { path = "../prompts" }
serde.workspace = true
serde_json.workspace = true
syntax = { path = "../syntax" }
text = { path = "../text" }
thiserror.workspace = true

[dev-dependencies]
checks = { path = "../checks" }
io = { path = "../io", features = ["test-support"] }
store = { path = "../store" }
text = { path = "../text", features = ["test-support"] }
