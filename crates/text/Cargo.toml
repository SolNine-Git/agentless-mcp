[package]
name = "text"
description = "Text rules that the tokenizer, the checks and the renderers share: line breaks, whitespace, the printable rule, decimal integer text, and text that can hold a lone surrogate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# text::testing, the fixture reader and decoders for the tests of other crates.
test-support = ["dep:serde", "dep:serde_json"]

[dependencies]
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true
