# The third-party packages that the workspace uses. The owner reviews each name, and each change needs a
# commit with a `Policy-Change: crates/dependencies.toml` trailer. A stale name fails too. A package can
# be in both keys.
# direct: the package name of each dependency of a workspace package that is not a path dependency, of
# every kind and target. `cargo xtask layers` checks it.
direct = [
    "cc",
    "libc",
    "proc-macro2",
    "rmcp",
    "rusqlite",
    "rustix",
    "ruzstd",
    "serde",
    "serde_json",
    "sha2",
    "signal-hook",
    "tar",
    "thiserror",
    "tiktoken-rs",
    "tokio",
    "toml",
    "tree-sitter",
    "tree-sitter-language",
    "wait-timeout",
]
# build-time: each third-party package with a proc-macro or build-script target in the resolved graph,
# read with every feature on (`cargo metadata --all-features`). Its code runs on every build.
# `cargo xtask ground-truth` checks it after its clippy build, and names each package that the list lacks.
build-time = [
    "anyhow",
    "futures-macro",
    "getrandom",
    "iana-time-zone-haiku",
    "libc",
    "libsqlite3-sys",
    "num-traits",
    "pastey",
    "proc-macro2",
    "quote",
    "ref-cast",
    "ref-cast-impl",
    "rmcp",
    "rustix",
    "rustversion",
    "schemars_derive",
    "serde",
    "serde_core",
    "serde_derive",
    "serde_json",
    "signal-hook",
    "thiserror",
    "thiserror-impl",
    "tokio-macros",
    "tracing-attributes",
    "tree-sitter",
    "tree-sitter-language",
    "wasm-bindgen",
    "wasm-bindgen-macro",
    "wasm-bindgen-shared",
    "windows-implement",
    "windows-interface",
    "zmij",
]
# Vendored C code, outside cargo: crates/syntax/vendor/grammars-1.14.3.tar.zst holds the C sources of
# 22 tree-sitter grammars from the parser-sources-1.14.3 release asset of tree-sitter-language-pack,
# the pack's ctype_shim.h, and utf8proc 2.10. Each grammar keeps its own license (MIT, or Apache-2.0
# for hcl), under licenses/. utf8proc 2.10 (MIT, with Unicode data terms) keeps its license at
# shim/utf8proc/LICENSE.md. MANIFEST.toml beside the archive lists each file with its source, size
# and sha256.
