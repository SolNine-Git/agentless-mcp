name = "yaml"
tier = 2
extensions = [".yaml", ".yml"]
probe = "x: 1\n"
probe_root = "stream"
comments = ["comment"]

[extraction]
prefix = "yaml"
symbols = "data_keys"
imports = "none"
roles = "plain"
identifiers = ["double_quote_scalar", "single_quote_scalar", "string_scalar"]
bodies = []
skeleton_functions = []

[extraction.declarations]
functions = []
classes = []
imports = []
name_field = "name"
import_path_kind = "string"
names = ["identifier", "property_identifier", "type_identifier", "word"]
class_bodies = []
signature_from_header = false
import_binding = "module_object"
modifiers = []
bindings = []
function_values = []
constants = []
constant_keywords = []
