name = "typescript"
tier = 1
extensions = [".ts"]
probe = "const x: number = 1;\n"
probe_root = "program"
comments = ["comment"]
sloc = "leaves"

[units]
units = ["function_declaration", "generator_function_declaration", "method_definition"]
scopes = ["abstract_class_declaration", "class", "class_declaration"]
bound = ["arrow_function", "function_expression", "generator_function"]
name = "field"
binding = "typescript"

[decisions]
points = [
    "catch_clause",
    "do_statement",
    "for_in_statement",
    "for_statement",
    "if_statement",
    "switch_case",
    "ternary_expression",
    "while_statement",
]

[decisions.conditional]

[decisions.field_operators]
"binary_expression" = ["&&", "??", "||"]

[decisions.token_operators]

[clones]
functions = [
    "arrow_function",
    "function_declaration",
    "function_expression",
    "generator_function",
    "generator_function_declaration",
    "method_definition",
]
blocks = [
    "do_statement",
    "for_in_statement",
    "for_statement",
    "if_statement",
    "switch_statement",
    "try_statement",
    "while_statement",
]
identifiers = [
    "identifier",
    "private_property_identifier",
    "property_identifier",
    "shorthand_property_identifier",
    "shorthand_property_identifier_pattern",
    "statement_identifier",
    "type_identifier",
]
indent_blocks = []

[clones.literals]
"BOOL" = ["false", "true"]
"NONE" = ["null", "undefined"]
"NUM" = ["number"]
"STR" = ["regex", "string", "template_string"]

[extraction]
prefix = "ts"
symbols = "generic"
imports = "generic"
roles = "plain"
identifiers = [
    "identifier",
    "property_identifier",
    "shorthand_property_identifier",
    "shorthand_property_identifier_pattern",
    "type_identifier",
]
bodies = ["statement_block"]
skeleton_functions = ["arrow_function", "function_expression", "method_definition"]

[extraction.declarations]
functions = ["function_declaration", "generator_function_declaration", "method_definition"]
classes = ["class_declaration", "interface_declaration"]
imports = ["import_statement"]
name_field = "name"
import_path_field = "source"
import_path_kind = "string"
names = ["identifier", "property_identifier", "type_identifier", "word"]
class_bodies = []
signature_from_header = false
import_binding = "specifiers"
modifiers = ["accessibility_modifier"]
bindings = ["variable_declarator"]
function_values = ["arrow_function", "function", "function_expression", "generator_function"]
constants = []
constant_keywords = []
