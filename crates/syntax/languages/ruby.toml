name = "ruby"
tier = 1
extensions = [".rb"]
probe = "x = 1\n"
probe_root = "program"
comments = ["comment"]
sloc = "leaves"

[units]
units = ["method", "singleton_method"]
scopes = ["class", "module"]
bound = []
name = "field"

[decisions]
points = [
    "conditional",
    "elsif",
    "for",
    "if",
    "if_guard",
    "if_modifier",
    "rescue",
    "rescue_modifier",
    "unless",
    "unless_guard",
    "unless_modifier",
    "until",
    "until_modifier",
    "when",
    "while",
    "while_modifier",
]

[decisions.conditional]
"in_clause" = "counted_ruby_arm"

[decisions.field_operators]
"binary" = ["&&", "and", "or", "||"]

[decisions.token_operators]

[clones]
functions = ["method", "singleton_method"]
blocks = ["begin", "case", "case_match", "for", "if", "unless", "until", "while"]
identifiers = ["class_variable", "constant", "global_variable", "identifier", "instance_variable"]
indent_blocks = []

[clones.literals]
"BOOL" = ["false", "true"]
"FLOAT" = ["complex", "float", "rational"]
"INT" = ["integer"]
"NONE" = ["nil"]
"STR" = ["character", "delimited_symbol", "hash_key_symbol", "regex", "simple_symbol", "string"]

[extraction]
prefix = "rb"
symbols = "generic"
imports = "require"
roles = "plain"
identifiers = ["constant", "identifier"]
bodies = ["block", "body_statement", "do_block"]
skeleton_functions = ["method", "singleton_method"]

[extraction.declarations]
functions = ["method", "singleton_method"]
classes = ["class", "module"]
imports = []
name_field = "name"
import_path_kind = "string"
names = ["identifier", "property_identifier", "type_identifier", "word"]
class_bodies = []
signature_from_header = false
import_binding = "module_object"
modifiers = []
bindings = []
function_values = []
constants = []
constant_keywords = []
