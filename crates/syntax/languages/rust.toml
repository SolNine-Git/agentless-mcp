name = "rust"
tier = 1
extensions = [".rs"]
probe = "fn main() {}\n"
probe_root = "source_file"
comments = ["block_comment", "line_comment"]
sloc = "leaves"
callee_stoplist = ["clone", "into", "len", "new", "push", "unwrap"]

[units]
units = ["function_item"]
scopes = ["impl_item", "mod_item", "trait_item"]
bound = []
name = "rust_impl"

[decisions]
points = ["for_expression", "if_expression", "while_expression"]

[decisions.conditional]
"match_arm" = "counted_rust_arm"
"match_pattern" = "has_condition"

[decisions.field_operators]
"binary_expression" = ["&&", "||"]

[decisions.token_operators]
"let_chain" = ["&&"]

[clones]
functions = ["function_item"]
blocks = [
    "for_expression",
    "if_expression",
    "loop_expression",
    "match_expression",
    "while_expression",
]
identifiers = ["field_identifier", "identifier", "shorthand_field_identifier", "type_identifier"]
indent_blocks = []

[clones.literals]
"BOOL" = ["boolean_literal"]
"FLOAT" = ["float_literal"]
"INT" = ["integer_literal"]
"STR" = ["char_literal", "raw_string_literal", "string_literal"]

[extraction]
prefix = "rs"
symbols = "rust"
imports = "rust"
roles = "rust"
identifiers = ["field_identifier", "identifier", "type_identifier"]
bodies = ["block"]
skeleton_functions = ["function_item"]
scope_owners = [
    "const_item",
    "enum_item",
    "foreign_mod_item",
    "function_item",
    "function_signature_item",
    "impl_item",
    "macro_definition",
    "mod_item",
    "static_item",
    "struct_item",
    "trait_item",
    "type_item",
    "union_item",
]
opaque_scopes = ["attribute_item", "inner_attribute_item", "macro_definition"]
nested_patterns = [
    "captured_pattern",
    "mut_pattern",
    "or_pattern",
    "parameter",
    "ref_pattern",
    "reference_pattern",
    "slice_pattern",
    "tuple_pattern",
    "variadic_parameter",
]
typed_patterns = ["struct_pattern", "tuple_struct_pattern"]
path_parents = [
    "scoped_identifier",
    "scoped_type_identifier",
    "scoped_use_list",
    "use_as_clause",
    "use_declaration",
    "use_list",
    "use_wildcard",
]
