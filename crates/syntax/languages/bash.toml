name = "bash"
tier = 1
extensions = [".bash", ".sh"]
probe = "x=1\n"
probe_root = "program"
comments = ["comment"]
sloc = "leaves"

[units]
units = ["function_definition"]
scopes = []
bound = []
name = "field"

[decisions]
points = [
    "c_style_for_statement",
    "elif_clause",
    "for_statement",
    "if_statement",
    "ternary_expression",
    "while_statement",
]

[decisions.conditional]
"case_item" = "counted_case_item"

[decisions.field_operators]
"binary_expression" = ["&&", "-a", "-o", "||"]

[decisions.token_operators]
"list" = ["&&", "||"]

[clones]
functions = ["function_definition"]
blocks = [
    "c_style_for_statement",
    "case_statement",
    "for_statement",
    "if_statement",
    "while_statement",
]
identifiers = ["variable_name", "word"]
indent_blocks = []

[clones.literals]
"NUM" = ["number"]
"STR" = ["ansi_c_string", "heredoc_body", "raw_string", "string", "translated_string"]
