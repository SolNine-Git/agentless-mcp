[package]
name = "hook"
description = "The hooks that Claude Code runs around tool calls and prompts: the erosion gate before each Write and Edit, with its in-process lint, decision and log record, the search gate that holds broad text search until a localizing agentless call, and the prompt map that names the files that rank first for the names in the first prompt of a session."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
app = { path = "../app" }
checks = { path = "../checks" }
git = { path = "../git" }
io = { path = "../io" }
json = { path = "../json" }
kernel = { path = "../kernel" }
prompts = { path = "../prompts" }
render = { path = "../render" }
serde.workspace = true
sha2.workspace = true
signal-hook.workspace = true
text = { path = "../text" }

[dev-dependencies]
io = { path = "../io", features = ["test-support"] }
kernel = { path = "../kernel", features = ["test-support"] }
serde_json.workspace = true
