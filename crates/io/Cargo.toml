[package]
name = "io"
description = "The tool's file and process operations: a bounded process runner, bounded reads and walks, path containment, the log append, the cache root, and the project config."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# io::testing::Tree and io::testing::cases, for the tests of other crates.
test-support = ["dep:serde_json"]

[dependencies]
kernel = { path = "../kernel" }
libc = "0.2.180"
pycompat = { path = "../pycompat" }
serde.workspace = true
serde_json = { workspace = true, optional = true }
wait-timeout = "0.2.1"

[dev-dependencies]
serde_json.workspace = true
