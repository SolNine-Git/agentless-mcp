# Tighter than clippy's defaults (100 lines, 7 arguments, no nesting limit), so that functions stay small.
too-many-lines-threshold = 60
too-many-arguments-threshold = 5
excessive-nesting-threshold = 4
disallowed-methods = [
    { path = "std::fs::write", reason = "file writes go through the io crate" },
    { path = "std::fs::rename", reason = "file writes go through the io crate" },
    { path = "std::fs::copy", reason = "file writes go through the io crate" },
    { path = "std::fs::create_dir", reason = "file writes go through the io crate" },
    { path = "std::fs::create_dir_all", reason = "file writes go through the io crate" },
    { path = "std::fs::remove_file", reason = "file writes go through the io crate" },
    { path = "std::fs::remove_dir", reason = "file writes go through the io crate" },
    { path = "std::fs::remove_dir_all", reason = "file writes go through the io crate" },
    { path = "std::fs::hard_link", reason = "file writes go through the io crate" },
    { path = "std::fs::soft_link", reason = "file writes go through the io crate" },
    { path = "std::fs::set_permissions", reason = "file writes go through the io crate" },
    { path = "std::fs::File::create", reason = "file writes go through the io crate" },
    { path = "std::fs::File::create_new", reason = "file writes go through the io crate" },
    { path = "std::fs::File::set_permissions", reason = "file writes go through the io crate" },
    { path = "std::fs::File::set_modified", reason = "file writes go through the io crate" },
    { path = "std::fs::OpenOptions::open", reason = "file writes go through the io crate" },
    { path = "std::fs::DirBuilder::create", reason = "file writes go through the io crate" },
    { path = "std::os::unix::fs::symlink", reason = "file writes go through the io crate" },
    { path = "std::os::unix::fs::chown", reason = "file writes go through the io crate" },
    { path = "std::os::unix::fs::fchown", reason = "file writes go through the io crate" },
    { path = "std::os::unix::fs::lchown", reason = "file writes go through the io crate" },
]
