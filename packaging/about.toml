# cargo-about reads this file to write the third-party crate notices. deny.toml holds the license
# policy: a license that this list lacks fails the notices, and one that deny.toml lacks fails cargo deny.
accepted = ["MIT", "Apache-2.0", "Unicode-3.0", "Zlib"]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true

[private]
ignore = true
