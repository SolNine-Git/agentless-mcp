# Pre-commit hooks configuration
# The real gate is `uv run pre-commit run --all-files`.
# See https://pre-commit.com for more information

repos:
  # Standard pre-commit hooks for general best practices
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Trim trailing whitespace
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        # 2026-08-18, Phase 1a: the fixture repositories and their skeleton
        # goldens are byte-exact test data. A hook that rewrites them would
        # invalidate every golden without touching a line of source.
        exclude: ^tests/characterization/(fixtures|goldens)/
      # Ensure files end with a single newline
      - id: end-of-file-fixer
        # Same reason as trailing-whitespace above.
        exclude: ^tests/characterization/(fixtures|goldens)/
      # Check YAML files for parseable syntax
      - id: check-yaml
      # Check TOML files for parseable syntax
      - id: check-toml
      # Check JSON files for parseable syntax
      - id: check-json
      # Check for merge conflict strings
      - id: check-merge-conflict
      # Check for files that would conflict on case-insensitive filesystems
      - id: check-case-conflict
      # Check for debugger imports and py37+ breakpoint() calls
      - id: debug-statements
        # The complexity fixtures are tree-sitter input with syntax newer than
        # Python 3.10, such as except*, and CI runs these hooks on 3.10.
        exclude: ^tests/characterization/fixtures/complexity_py/
      # Detect accidentally committed private keys
      - id: detect-private-key
      # Check that Python files have valid syntax
      - id: check-ast
        # Same reason as debug-statements above.
        exclude: ^tests/characterization/fixtures/complexity_py/
      # Prevent accidental commits of large files
      - id: check-added-large-files
        args: [--maxkb=1000]
        # The vendored grammar archive is about 4.8 MB. Its MANIFEST.toml and a syntax test check it.
        exclude: ^crates/syntax/vendor/grammars-1\.14\.3\.tar\.zst$
      # Check for symlinks that don't point to anything
      - id: check-symlinks

  # Ruff - linter and formatter (replaces flake8, isort, black)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff
        name: ruff-check
        args: [--fix]
      - id: ruff-format

  # Mypy - static type checker, strict mode
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        # The hook builds its own isolated env, so the runtime dependencies
        # whose stubs mypy needs are declared here as well as in pyproject.
        additional_dependencies:
          - tree-sitter>=0.25,<0.27
          - tree-sitter-language-pack==1.14.3
          - tomli>=2
          # 2026-08-18, Phase 1b: adapters/mcp imports fastmcp, so the hook's
          # isolated env needs it or mypy reports a missing stub for a module
          # that is present in the project env. Bounded to the same majors as
          # the pyproject mcp extra, and kept in step with it: this env
          # resolves fresh from PyPI, so an open bound let mcp 2 / fastmcp 4
          # land here and fail mypy on imports the locked project env serves
          # fine (#48). mcp is named because server.py imports it directly.
          - fastmcp>=3.4,<4
          - mcp>=1.29,<2
        args: [--config-file=pyproject.toml]
        files: ^src/

  # Codespell - common misspellings in text files
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        # The audit record quotes evidence verbatim, including strings that
        # are misspelled on purpose. Correcting it would edit the transcript.
        # The public-api.txt snapshots are generated, and serde's module paths in them read as typos.
        # The crates' fixtures/ files are generated test data, and their escaped inputs read as typos.
        exclude: ^(\.audit/|crates/.*/public-api\.txt$|crates/[^/]+/fixtures/)
        args:
          - --skip=*.pyc,.git,.mypy_cache,.ruff_cache,.pytest_cache,__pycache__,uv.lock
          - --ignore-words-list=mcp,readonly,crate
          # serde exports SerializeMap only at serde::ser::SerializeMap, and serde_json exports
          # Formatter only at serde_json::ser::Formatter, so the regex removes both paths.
          - '--ignore-regex=(?<!\w)serde_json::ser::|(?<!\w)serde::ser::'
          - --check-filenames
          - --check-hidden

  - repo: local
    hooks:
      - id: lint-imports
        name: import-linter (dependency contract)
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        files: \.py$
      - id: deptry
        name: deptry (dependency hygiene)
        entry: uv run deptry .
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|.*\.py)$

  - repo: local
    hooks:
      - id: ruff-repo-wide
        name: ruff (repo-wide sweep, pre-push)
        entry: uv run ruff check .
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: pytest-unit
        name: pytest (unit suite, pre-push)
        entry: bash -c 'uv run pytest tests/unit -q 2>/dev/null || uv run pytest tests -q'
        language: system
        pass_filenames: false
        stages: [pre-push]

  # The Rust workspace (crates/ and xtask/). CI's rust job runs these; the Python jobs skip them.
  # Each trigger matches every repository file its tool reads, in any case: macOS ignores case.
  # Every trigger also matches the manifests, the lock, the toolchain file and .cargo/: cargo and rustup
  # read them.
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --check
        language: system
        files: (?i:^(crates|xtask)/.*\.rs$|(^|/)(Cargo\.(toml|lock)|rust-toolchain(\.toml)?|\.?rustfmt\.toml)$|(^|/)\.cargo/)
        pass_filenames: false
      # Every file below crates/ and xtask/: include_str! and build scripts can read any of them.
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        files: (?i:^(crates|xtask)/|(^|/)(Cargo\.(toml|lock)|rust-toolchain(\.toml)?|\.?clippy\.toml)$|(^|/)\.cargo/)
        pass_filenames: false
      # import-linter and the noqa ratchet, for Rust: the trigger matches every tool config file anywhere.
      # The non-ASCII class stays outside (?i:), which folds some non-ASCII characters to ASCII.
      - id: cargo-gates
        name: cargo xtask static-gates
        entry: cargo xtask static-gates
        language: system
        files: (?i:^(crates|xtask)/|(^|/)(Cargo\.(toml|lock)|rust-toolchain(\.toml)?|\.?clippy\.toml|\.?rustfmt\.toml|\.?deny(\.exceptions)?\.toml|\.agentless-mcp\.json|\.(git|rg)?ignore)$|(^|/)\.cargo/)|[^\x20-\x7e]
        pass_filenames: false
      # deptry for Rust. machete reads every manifest under crates/ and xtask/ (where static-gates keeps
      # each package): --no-ignore, and roots instead of --skip-target-dir, which skips any dir named target.
      - id: cargo-deps
        name: cargo machete and cargo deny
        entry: bash -c 'cargo machete --no-ignore crates xtask && cargo deny check'
        language: system
        files: (?i:\.rs$|(^|/)(Cargo\.(toml|lock)|rust-toolchain(\.toml)?|\.?deny(\.exceptions)?\.toml)$|(^|/)\.cargo/)
        pass_filenames: false
      # What the token rules cannot see: force-warned suppressions, the files rustc reads, the cfg names,
      # the build-time packages, and the ignored tests. rustc can read any repository file through an
      # include, so every file triggers this hook.
      - id: cargo-ground-truth
        name: cargo xtask ground-truth (pre-push)
        entry: cargo xtask ground-truth
        language: system
        pass_filenames: false
        stages: [pre-push]
      # nextest reads .config/nextest.toml, and insta reads .config/insta.yaml, insta.yaml or .insta.yaml.
      - id: cargo-test
        name: cargo tests and snapshots (pre-push)
        entry: cargo insta test --check --workspace --test-runner nextest
        language: system
        files: (?i:^(crates|xtask)/|^\.config/|^src/agentless_mcp/prompts/(envelope|messages|contract_rules)\.json$|(^|/)(Cargo\.(toml|lock)|rust-toolchain(\.toml)?|\.?insta\.yaml)$|(^|/)\.cargo/)
        pass_filenames: false
        stages: [pre-push]
      - id: cargo-public-api
        name: cargo xtask public-api (pre-push)
        entry: cargo xtask public-api
        language: system
        files: (?i:^(crates|xtask)/|(^|/)(Cargo\.(toml|lock)|rust-toolchain(\.toml)?)$|(^|/)\.cargo/)
        pass_filenames: false
        stages: [pre-push]
      # lint --since reads every file that changed since the base, so every file triggers this hook.
      - id: cargo-erosion
        name: cargo xtask erosion with the uv tool agentless-mcp (pre-push)
        # The gate is the uv tool install at the version it holds. This hook does not check the version.
        # Inside uv run, a PATH lookup finds the build under test, which is never a gate.
        entry: bash -c 'gate="$(uv tool dir --bin)/agentless-mcp" && cargo xtask erosion --lint-bin "$gate" --health-bin "$gate"'
        language: system
        pass_filenames: false
        stages: [pre-push]
      # Pre-push only: a policy change is legal in a commit that carries its Policy-Change trailer, and
      # the commit stage runs before that commit exists. The trigger is the policy items and xtask.
      - id: cargo-policy
        name: cargo xtask policy (pre-push)
        entry: cargo xtask policy
        language: system
        files: (?i:^xtask/|^(\.agentless-mcp\.json|deny\.toml|rustfmt\.toml|\.config/nextest\.toml|crates/(dependencies|layers)\.toml)$|(^|/)(Cargo\.(toml|lock)|rust-toolchain(\.toml)?|\.?clippy\.toml)$|(^|/)\.cargo/)
        pass_filenames: false
        stages: [pre-push]

# Files to exclude from all hooks
exclude: |
  (?x)^(
      \.git/|
      \.mypy_cache/|
      \.ruff_cache/|
      \.pytest_cache/|
      __pycache__/|
      .*\.egg-info/|
      build/|
      dist/
  )$

default_install_hook_types: [pre-commit, pre-push]
