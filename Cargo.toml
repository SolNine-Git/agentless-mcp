[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.11.0-rc.1"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/SolNine-Git/agentless-mcp"
publish = false

[workspace.dependencies]
cc = "1.2.48"
libc = "0.2.180"
proc-macro2 = { version = "1", features = ["span-locations"] }
ruzstd = { version = "0.8", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
signal-hook = { version = "0.3.18", default-features = false, features = ["iterator"] }
tar = { version = "0.4", default-features = false }
thiserror = "2"
toml = "0.9"
tree-sitter = "=0.26.9"
tree-sitter-language = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes = "forbid"
dbg_macro = "forbid"
todo = "forbid"
unimplemented = "forbid"
