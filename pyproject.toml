# The development tools of this repository: pre-commit, ruff and codespell, with their
# configuration. It builds no package: packaging/pyproject.toml builds the wheel.
[project]
name = "agentless-mcp-dev"
version = "0"
requires-python = ">=3.11"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "codespell>=2.4.3",
    "pre-commit>=4.6.2",
    "ruff>=0.16.3",
]

[tool.ruff]
# Repo-relative on purpose: ruff aborts the whole run (exit 2) when an
# extended file is missing, so pointing at the vault copy would break
# `ruff check` on every checkout but this machine. The shared policy is
# vendored into config/ruff-base.toml from the shared policy source; refresh
# that copy through the policy-maintenance workflow rather than editing it here.
extend = "config/ruff-base.toml"
target-version = "py310"
line-length = 100

exclude = [
    # 2026-08-18, Phase 1a: the fixture repositories and their goldens are
    # DATA, not code. Byte-exact goldens are the contract the skeletonizer is
    # tested against, so a formatter or an import-order fix rewriting a
    # fixture would silently invalidate every golden.
    "tests/characterization/fixtures",
    "tests/characterization/goldens",
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "*.egg-info",
    "build",
    "dist",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
]

[tool.ruff.lint]
# extend-select only: `select` would replace the shared policy in
# config/ruff-base.toml wholesale rather than union with it.
extend-select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (import sorting)
    "N",      # pep8-naming
    "UP",     # pyupgrade (modern Python syntax)
    "ANN",    # flake8-annotations (type hints)
    "B",      # flake8-bugbear (bug detection)
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez (timezone awareness)
    "T10",    # flake8-debugger
    "EM",     # flake8-errmsg (error message formatting)
    "ISC",    # flake8-implicit-str-concat
    "ICN",    # flake8-import-conventions
    "PIE",    # flake8-pie (misc lints)
    "PT",     # flake8-pytest-style
    "Q",      # flake8-quotes
    "RSE",    # flake8-raise (exception handling)
    "RET",    # flake8-return (return statement)
    "SIM",    # flake8-simplify
    "TID",    # flake8-tidy-imports
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib (prefer pathlib over os.path)
    "PL",     # pylint rules
    "RUF",    # Ruff-specific rules
]

extend-ignore = [
    # 2026-08-18, scaffold: Any is used deliberately at the MCP/CLI argument
    # boundary where the parse step is what produces typed values.
    "ANN401",
    # 2026-08-18, scaffold: ISC001 conflicts with ruff-format.
    "ISC001",
]

fixable = ["ALL"]
unfixable = []

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.codespell]
# .audit is skipped rather than corrected: it is a review record that quotes
# evidence verbatim, including undecodable byte literals and misspelled enum
# values that tests supply precisely because they are not real spellings.
# Spell-checking a transcript means editing what was measured. The
# pre-commit hook needs its own exclude for this: it names each file, and
# codespell matches a named file by its whole path, which `.audit` does not
# match. A tree walk matches `.audit` against the directory name.
# The public-api.txt snapshots are generated, and serde's module paths in
# them read as typos. The leading * matches both ./crates/... (a tree walk)
# and crates/... (a named file).
# The crates' fixtures/ files are generated test data, and their escaped inputs read as typos.
skip = ".git,.venv,venv,*.pyc,__pycache__,*.egg-info,build,dist,target,.mypy_cache,.pytest_cache,.ruff_cache,uv.lock,.audit,*crates/*/public-api.txt,*crates/*/fixtures/*"
ignore-words-list = "mcp,readonly,crate"
# serde exports SerializeMap only at serde::ser::SerializeMap, and serde_json exports Formatter
# only at serde_json::ser::Formatter, so the regex removes both paths.
ignore-regex = '(?<!\w)serde_json::ser::|(?<!\w)serde::ser::'
